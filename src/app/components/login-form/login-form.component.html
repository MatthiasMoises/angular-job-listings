<section class="bg-indigo-50">
  <div class="container m-auto max-w-2xl py-24">
    <div class="bg-white px-6 py-8 mb-4 shadow-md rounded-md border m-4 md:m-0">
      <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm">
        <h2 class="text-3xl text-center font-semibold mb-6">Please log in with your credentials</h2>

        <div class="mb-4">
          <label for="email" class="block text-gray-700 font-bold mb-2">
            Email
          </label>
          <input type="email" id="email" name="email" placeholder="Email" class="border rounded w-full py-2 px-3"
            [(ngModel)]="model.email" #email="ngModel" required>

          <div [hidden]="email.valid || email.pristine" class="alert alert-danger">
            Email is required
          </div>
        </div>
        <div class="mb-4">
          <label for="email" class="block text-gray-700 font-bold mb-2">
            Password
          </label>
          <input type="password" id="password" name="password" placeholder="Password"
            class="border rounded w-full py-2 px-3" [(ngModel)]="model.password" #password="ngModel" required>

          <div [hidden]="password.valid || password.pristine" class="alert alert-danger">
            Password is required
          </div>
        </div>
        <div>
          <button class="font-bold py-2 px-4 rounded-full w-full"
            [ngClass]="{'bg-fuchsia-500 hover:bg-fuchsia-600 text-white focus:outline-none focus:shadow-outline': loginForm.form.valid, 'bg-gray-300 cursor-not-allowed opacity-50': !loginForm.form.valid}"
            type="submit" [disabled]="!loginForm.form.valid">
            Log In
          </button>
        </div>
        <div [hidden]="!loginError" class="login-error">
          <span>{{ loginError }}</span>
        </div>
      </form>
    </div>
  </div>
</section>
